name: Feature request
description: Suggest an entity, control or improvement
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: textarea
    id: api
    attributes:
      label: Relevant TOS API endpoint
      description: If you know which /v2/ endpoint exposes this, say so — it saves a lot of work.
