name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: input
    id: model
    attributes:
      label: NAS model
      placeholder: F4-425
    validations:
      required: true
  - type: input
    id: tos
    attributes:
      label: TOS version
      placeholder: 6.0.x
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Enable debug logging, reproduce, then paste the output.
        Redact your NAS host, usernames and serial numbers.
      render: text
