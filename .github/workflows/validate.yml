name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches breakage from new Home Assistant or HACS releases.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # `description` and `topics` are inclusion criteria for the HACS default
          # store, which this repository is not submitted to. Everything that
          # matters for a custom repository still runs: hacsjson,
          # integration_manifest, brands, license, archived, issues, information.
          ignore: "description topics"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
